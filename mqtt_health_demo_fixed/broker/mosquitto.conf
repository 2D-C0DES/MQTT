# mosquitto.conf — Mosquitto MQTT Broker Configuration
# ======================================================
# Minimal config for local development / college demo.
# Place this file in the broker/ folder and run:
#   mosquitto -c broker/mosquitto.conf -v
#
# Or just run with defaults:
#   mosquitto -v

# ── Listener ──────────────────────────────────────────────────────
listener 1884 localhost

# ── Allow anonymous connections (no password for demo) ────────────
# In production you would set:
#   allow_anonymous false
#   password_file /path/to/pwfile
allow_anonymous true

# ── Persistence (save messages across restarts) ───────────────────
persistence true
persistence_location C:\mqtt\data\

# ── Logging ───────────────────────────────────────────────────────
log_type all
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# ── QoS retained messages ─────────────────────────────────────────
retain_available true

# ── Max inflight messages (relevant for QoS 1 & 2) ───────────────
max_inflight_messages 20

# ── Keep-alive timeout ────────────────────────────────────────────
# keepalive_interval 60
